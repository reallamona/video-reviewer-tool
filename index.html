<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Video Reviewer</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- =========================
     Header
========================= -->

<header>

    <h1>
        Video Reviewer
    </h1>

</header>


<!-- =========================
     Main Layout
========================= -->

<main class="container">


    <!-- =========================
         Video Workspace
    ========================= -->

    <section class="viewer">


        <!-- =========================
             Video Sources
        ========================= -->

        <section class="video-sources">

            <input
                type="file"
                id="videoUpload"
                accept="video/*"
            >

            <input
                type="text"
                id="videoURL"
                placeholder="Paste YouTube URL"
            >

            <button id="loadURLBtn">
                Load URL
            </button>

        </section>


        <!-- =========================
             Video Player
        ========================= -->

        <section class="video-container">

            <video
                id="video"
                controls
            ></video>

            <div id="youtubePlayer"></div>

        </section>


        <!-- =========================
             Playback
        ========================= -->

        <section class="playback-panel">


            <h2>
                Playback
            </h2>


            <!-- Playback Information -->

            <div class="playback-info">


                <div class="playback-stat">

                    <span class="stat-label">
                        Current Time
                    </span>

                    <span
                        id="currentTime"
                        class="stat-value"
                    >
                        00:00:00.000
                    </span>

                </div>


                <div class="playback-stat">

                    <span class="stat-label">
                        Duration
                    </span>

                    <span
                        id="duration"
                        class="stat-value"
                    >
                        00:00:00.000
                    </span>

                </div>


                <div class="playback-stat">

                    <span class="stat-label">
                        Frame
                    </span>

                    <span
                        id="frameNumber"
                        class="stat-value"
                    >
                        0
                    </span>

                </div>


                <div class="playback-stat">

                    <span class="stat-label">
                        FPS
                    </span>

                    <span
                        id="fps"
                        class="stat-value"
                    >
                        30
                    </span>

                </div>


            </div>


            <!-- =========================
                 Playback Options
            ========================= -->

            <div class="playback-options">

                <label for="fpsSelect">
                    FPS:
                </label>

                <select id="fpsSelect">

                    <option value="30">
                        30 FPS
                    </option>

                    <option value="60">
                        60 FPS
                    </option>

                </select>

            </div>


            <!-- =========================
                 Playback Actions
            ========================= -->

            <div class="frame-buttons">

                <button id="removeVideoBtn">
                    Remove Video
                </button>

                <button id="captureBtn">
                    Capture Screenshot
                </button>

            </div>


            <!-- =========================
                 Frame Movement
            ========================= -->

            <div class="frame-controls">


                <button id="previousFrame">
                    -1f
                </button>

                <button id="nextFrame">
                    +1f
                </button>


                <button id="back5">
                    -5f
                </button>

                <button id="forward5">
                    +5f
                </button>


                <button id="back10">
                    -10f
                </button>

                <button id="forward10">
                    +10f
                </button>


                <button id="back30">
                    -30f
                </button>

                <button id="forward30">
                    +30f
                </button>


                <button id="back1m">
                    -1m
                </button>

                <button id="forward1m">
                    +1m
                </button>


                <button id="back5m">
                    -5m
                </button>

                <button id="forward5m">
                    +5m
                </button>


            </div>


        </section>


    </section>


    <!-- =========================
         Sidebar
    ========================= -->

    <aside class="sidebar">


        <!-- =========================
             Notes
        ========================= -->

        <section class="panel">

            <h2>
                Notes
            </h2>

            <textarea
                id="noteInput"
                placeholder="Write a note..."
                autocomplete="off"
            ></textarea>

            <button id="addNoteBtn">
                Add Note
            </button>

            <ul id="notesList"></ul>

        </section>


        <!-- =========================
             Screenshots
        ========================= -->

        <section class="panel">

            <h2>
                Screenshots
            </h2>

            <div id="screenshots"></div>

        </section>


    </aside>


</main>


<!-- =========================
     JavaScript
========================= -->

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>


    <!-- Video -->
    <script src="js/video/youtube.js"></script>
    <script src="js/video/video.js"></script>


    <!-- Analysis -->
    <script src="js/analysis/playback.js"></script>
    <script src="js/analysis/frames.js"></script>


    <!-- Research -->
    <script src="js/research/notes.js"></script>
    <script src="js/research/screenshots.js"></script>


    <!-- App -->
    <script src="js/app.js"></script>


</body>

</html>
